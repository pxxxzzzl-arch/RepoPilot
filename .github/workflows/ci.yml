name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ISSUE2PATCH_RUN_LIVE_API: "0"
  ISSUE2PATCH_RUN_DEEPSEEK_LIVE_API: "0"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run offline unit tests
        run: pytest -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: issue2patch --version

  docker:
    name: Build sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Build the network-disabled runtime image
        run: docker build --pull -f docker/sandbox.Dockerfile -t issue2patch-sandbox:py311 .
      - name: Exercise the real sandbox boundaries
        run: pytest tests/test_sandbox_integration.py -q
