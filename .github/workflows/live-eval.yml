name: Live Agent Evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model API provider
        required: true
        default: openai
        type: choice
        options:
          - openai
          - deepseek
      model:
        description: Optional model ID; blank selects the provider default
        required: false
        default: ""
        type: string
      runs:
        description: Runs per task (10 tasks; 3 means 30 paid Agent runs)
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
      publish_results:
        description: Commit eval reports and live E2E evidence back to main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-agent-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Docker + real model evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      DEEPSEEK_API_KEY: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
      ISSUE2PATCH_RUN_LIVE_API: "0"
      PROVIDER: ${{ inputs.provider }}
      REQUESTED_MODEL: ${{ inputs.model }}
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve provider model and require its repository secret
        shell: bash
        run: |
          case "$PROVIDER" in
            deepseek)
              secret="$DEEPSEEK_API_KEY"
              default_model="deepseek-v4-flash"
              secret_name="DEEPSEEK_API_KEY"
              ;;
            openai)
              secret="$OPENAI_API_KEY"
              default_model="gpt-5.6-luna"
              secret_name="OPENAI_API_KEY"
              ;;
            *)
              echo "Unsupported provider: $PROVIDER" >&2
              exit 2
              ;;
          esac
          if [[ -z "$secret" ]]; then
            echo "Repository secret $secret_name is not configured." >&2
            exit 2
          fi
          model="${REQUESTED_MODEL:-$default_model}"
          echo "MODEL=$model" >> "$GITHUB_ENV"
          echo "Using provider=$PROVIDER model=$model"
      - name: Install RepoPilot
        run: python -m pip install -e ".[dev]"
      - name: Build the locked-down sandbox image
        run: docker build --pull -f docker/sandbox.Dockerfile -t issue2patch-sandbox:py311 .
      - name: Verify the broken baseline and run one live repair
        id: live_e2e
        shell: bash
        run: |
          set -u
          mkdir -p live-evidence
          workdir="$(mktemp -d)"
          cp -R examples/broken_calculator/. "$workdir/"
          source_before="$(find "$workdir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"

          set +e
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65532:65532 \
            --mount "type=bind,source=$workdir,target=/workspace,readonly" \
            --workdir /workspace issue2patch-sandbox:py311 tests \
            >live-evidence/baseline.stdout 2>live-evidence/baseline.stderr
          baseline_status=$?
          issue2patch run \
            --repo "$workdir" \
            --issue "divide should return quotient" \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --approve \
            >live-evidence/live-e2e.diff 2>live-evidence/live-e2e.log
          agent_status=$?
          set -e

          source_after="$(find "$workdir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)"
          printf '%s\n' "baseline_exit_code=$baseline_status" "agent_exit_code=$agent_status" \
            "source_unchanged=$([[ \"$source_before\" == \"$source_after\" ]] && echo true || echo false)" \
            >live-evidence/summary.txt

          test "$baseline_status" -ne 0
          test "$agent_status" -eq 0
          test -s live-evidence/live-e2e.diff
          test "$source_before" = "$source_after"
          grep -q '^Status: SUCCESS;' live-evidence/live-e2e.log
      - name: Run the fixed 10-task evaluation suite
        run: |
          issue2patch eval \
            --suite evals/suite.json \
            --runs "$RUNS" \
            --output eval-results \
            --provider "$PROVIDER" \
            --model "$MODEL" \
            --approve
      - name: Validate report identity and run count
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("eval-results/eval-report.json").read_text())
          expected_runs = 10 * int(os.environ["RUNS"])
          assert report["model"] == os.environ["MODEL"]
          assert report["aggregate"]["task_count"] == 10
          assert report["aggregate"]["total_runs"] == expected_runs
          assert len(report["records"]) == expected_runs
          PY
      - name: Upload reports and live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repopilot-live-eval-${{ inputs.provider }}-${{ github.run_id }}
          path: |
            eval-results/
            live-evidence/
          if-no-files-found: warn
          retention-days: 30
  publish:
    name: Publish explicitly approved results
    if: ${{ needs.evaluate.result == 'success' && inputs.publish_results }}
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download validated reports and evidence
        uses: actions/download-artifact@v8
        with:
          name: repopilot-live-eval-${{ inputs.provider }}-${{ github.run_id }}
          path: .
      - name: Publish approved results to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval-results live-evidence
          git commit -m "docs: publish live agent evaluation results"
          git push origin HEAD:main
