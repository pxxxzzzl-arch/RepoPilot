name: Bug report
description: Report a reproducible RepoPilot defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, source code, and API keys from all output.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe command or repository example.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoPilot version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: Test runner
      options:
        - Docker sandbox
        - Trusted local runner
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only the minimum output needed to diagnose the issue.
      render: text
